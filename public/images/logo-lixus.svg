<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="500" height="650">
    <!-- Outer Boundary -->
    <path d="M 5 125 V 50 A 45 45 0 0 1 95 50 V 125 Z" fill="#ffffff" stroke="#2b4c7e" stroke-width="4" />
    
    <!-- Inner Border (Double line effect) -->
    <path d="M 12 125 V 50 A 38 38 0 0 1 88 50 V 125" stroke="#2b4c7e" stroke-width="1" fill="none" />
    
    <!-- Structure Top -->
    <path d="M 22 45 L 50 30 L 78 45" stroke="#2b4c7e" stroke-width="2" fill="none" stroke-linejoin="round" />
    <circle cx="50" cy="38" r="2.5" fill="#2b4c7e" />

    <!-- Left and Right Columns -->
    <rect x="22" y="45" width="12" height="40" stroke="#2b4c7e" stroke-width="1.5" fill="#2b4c7e" fill-opacity="0.15" />
    <rect x="66" y="45" width="12" height="40" stroke="#2b4c7e" stroke-width="1.5" fill="#2b4c7e" fill-opacity="0.15" />
    
    <!-- Central Arch -->
    <path d="M 34 85 V 60 A 16 16 0 0 1 66 60 V 85" stroke="#2b4c7e" stroke-width="3.5" fill="none" />
    
    <!-- Inner arch detail -->
    <path d="M 40 85 V 65 A 10 10 0 0 1 60 65 V 85" stroke="#2b4c7e" stroke-width="1" fill="none" />

    <!-- Bottom Waves Area -->
    <path d="M 5 88 C 25 78, 45 98, 65 88 C 75 83, 85 83, 95 88 V 125 H 5 Z" fill="#2b4c7e" />
    
    <!-- White wave lines -->
    <path d="M 5 96 C 25 86, 45 106, 75 91 C 85 86, 90 86, 95 91" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 5 106 C 30 96, 50 116, 80 101 C 88 96, 92 96, 95 101" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 5 116 C 35 106, 55 126, 85 111 C 90 106, 93 106, 95 111" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
